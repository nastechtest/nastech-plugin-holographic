[project]
name = "nastech-plugin-holographic"
version = "0.7.0"
description = "Nastech Agent memory provider plugin: holographic"
requires-python = ">=3.11"
license = { text = "MIT" }
# Installed into the Nastech venv by `nastech plugins install` / `enable` and re-applied after
# every `nastech update` (nastech-agent#113851). Keep upper bounds: Nastech pins its own deps exactly
# and refuses a plugin whose requirements cannot resolve against them.
dependencies = [
    "numpy>=1.26,<3",
    "snowballstemmer>=2.2,<4",  # word forms in search (English, Russian); pure Python
]

[tool.pytest.ini_options]
testpaths = ["tests"]
