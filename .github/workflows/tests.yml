name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Allow long paths (nastech-agent's docs tree exceeds MAX_PATH)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
        with:
          path: plugin
          fetch-depth: 0  # tags: tests/test_holographic_compat.py runs v0.1.1 from its tag
      # The plugin imports Nastech core (agent, tools, nastech_cli) from a checkout, the way an installed plugin does.
      - uses: actions/checkout@v4
        with:
          repository: NastechResearch/nastech-agent
          path: nastech-agent
      # Nastech core gates every runtime dependency on python_version >= '3.14'; older Pythons install none of them.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install nastech-agent and this plugin's declared dependencies
        shell: bash
        run: |
          python -m pip install -e ./nastech-agent "pytest==9.1.1"
          python -c "import tomllib; print('\n'.join(tomllib.load(open('plugin/pyproject.toml', 'rb'))['project']['dependencies']))" > plugin-deps.txt
          python -m pip install -r plugin-deps.txt
      - name: Run the plugin suite
        working-directory: plugin
        env:
          NASTECH_AGENT_REPO: ${{ github.workspace }}/nastech-agent
        run: python -m pytest -q

  # The same check the Nastech plugin catalog runs on an entry at its pinned commit.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: NastechResearch/nastech-agent
          path: nastech-agent
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install nastech-agent
        run: python -m pip install -e ./nastech-agent
      - name: nastech plugins validate
        env:
          NASTECH_HOME: ${{ runner.temp }}/nastech-home
        run: nastech plugins validate --install-deps "$GITHUB_WORKSPACE/plugin" </dev/null
